<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Secret Santa Lictevout — Mission Top Secrète</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-top: #0b1630;
      --bg-mid: #13254b;
      --bg-bot: #1d1436;
      --card: rgba(255, 255, 255, 0.96);
      --ink: #1b2238;
      --muted: #5a6482;
      --red: #e63946;
      --red-dark: #b91c2b;
      --gold: #ffb703;
      --gold-dark: #e09600;
      --pine: #1b998b;
      --radius: 26px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100dvh;
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      color: #f8fafc;
      background: radial-gradient(circle at 20% 15%, #233c72 0%, transparent 45%),
                  radial-gradient(circle at 85% 80%, #4b1d4f 0%, transparent 45%),
                  linear-gradient(165deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bot) 100%);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    canvas.fx-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #snow-canvas { z-index: 1; }
    #confetti-canvas { z-index: 20; }

    main {
      position: relative;
      z-index: 5;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    }

    .hidden { display: none !important; }

    .screen {
      width: 100%;
      max-width: 470px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255, 183, 3, 0.16);
      border: 1px solid rgba(255, 183, 3, 0.45);
      color: #ffe08a;
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(0.72rem, 2.5vw, 0.82rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .hero-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.85rem, 6.5vw, 2.55rem);
      line-height: 1.12;
      margin-bottom: 10px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .hero-title .accent { color: var(--gold); }

    .hero-sub {
      color: #cbd5e1;
      font-size: clamp(0.95rem, 3.2vw, 1.05rem);
      line-height: 1.45;
      margin-bottom: 24px;
    }

    /* --- GIFT STAGE --- */
    .gift-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 8px;
    }

    .speech-bubble {
      position: relative;
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      font-size: clamp(0.92rem, 3.3vw, 1.02rem);
      padding: 12px 18px;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      max-width: 340px;
      transition: transform 0.2s ease;
    }

    .speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -9px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 3px;
    }

    .gift-btn {
      position: relative;
      width: min(210px, 56vw);
      height: min(210px, 56vw);
      border: none;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      padding: 0;
      margin: 14px 0 4px;
      outline: none;
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.45));
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .gift-btn:hover { transform: scale(1.04) rotate(-1.5deg); }
    .gift-btn:active { transform: scale(0.95); }
    .gift-btn:focus-visible { outline: 3px solid var(--gold); border-radius: 20px; }

    .gift-box {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .gift-body {
      position: absolute;
      bottom: 0;
      left: 8%;
      width: 84%;
      height: 66%;
      background: linear-gradient(145deg, var(--red) 0%, var(--red-dark) 100%);
      border-radius: 14px 14px 20px 20px;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.18);
    }

    .gift-body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.14) 2px, transparent 2px);
      background-size: 18px 18px;
    }

    .ribbon-v {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 22%;
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-dark));
    }

    .ribbon-h {
      position: absolute;
      top: 44%;
      left: 0;
      width: 100%;
      height: 18%;
      background: linear-gradient(180deg, var(--gold-dark), var(--gold), var(--gold-dark));
    }

    .gift-lid {
      position: absolute;
      top: 19%;
      left: 3%;
      width: 94%;
      height: 21%;
      background: linear-gradient(145deg, #f14a57 0%, var(--red) 100%);
      border-radius: 12px;
      border: 3px solid rgba(255, 255, 255, 0.22);
      z-index: 3;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
    }

    .gift-lid .ribbon-v { width: 20%; }

    .gift-bow {
      position: absolute;
      top: 3%;
      left: 50%;
      transform: translateX(-50%);
      width: 54%;
      height: 22%;
      z-index: 4;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
    }

    .bow-loop {
      position: absolute;
      bottom: 0;
      width: 52%;
      height: 100%;
      border: 8px solid var(--gold);
      border-radius: 50% 50% 10% 50%;
      background: rgba(255, 183, 3, 0.25);
    }

    .bow-loop.left { left: 2%; transform: rotate(-16deg); }
    .bow-loop.right { right: 2%; transform: scaleX(-1) rotate(-16deg); }

    .gift-tag {
      position: absolute;
      right: 12%;
      bottom: 14%;
      background: #fff9e6;
      color: var(--ink);
      font-family: 'Fredoka', sans-serif;
      font-size: 0.72rem;
      padding: 4px 8px;
      border-radius: 8px;
      transform: rotate(-10deg);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      z-index: 2;
    }

    @keyframes shake-soft {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-7deg) scale(1.04); }
      55% { transform: rotate(7deg) scale(1.05); }
      80% { transform: rotate(-3deg) scale(1.02); }
    }

    @keyframes shake-hard {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-12deg) scale(1.08); }
      45% { transform: rotate(12deg) scale(1.1); }
      70% { transform: rotate(-8deg) scale(1.06); }
      88% { transform: rotate(6deg) scale(1.03); }
    }

    .is-shaking-1 { animation: shake-soft 0.42s ease; }
    .is-shaking-2 { animation: shake-hard 0.46s ease; }

    .is-opening .gift-lid,
    .is-opening .gift-bow {
      transform: translateY(-95px) rotate(-22deg) scale(0.9);
      opacity: 0;
    }

    .steps-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .dots {
      display: flex;
      gap: 10px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.24);
      border: 2px solid rgba(255, 255, 255, 0.35);
      transition: all 0.25s ease;
    }

    .dot.active {
      background: var(--gold);
      border-color: #fff;
      transform: scale(1.2);
      box-shadow: 0 0 12px rgba(255, 183, 3, 0.75);
    }

    .step-label {
      font-size: 0.88rem;
      color: #cbd5e1;
      font-weight: 700;
    }

    /* --- REVEAL CARD --- */
    .reveal-card {
      position: relative;
      background: var(--card);
      color: var(--ink);
      border-radius: var(--radius);
      padding: clamp(20px, 5vw, 28px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      border: 3px solid rgba(255, 183, 3, 0.75);
      animation: pop-in 0.55s cubic-bezier(0.22, 1.25, 0.36, 1) both;
    }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(24px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .stamp {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      background: #fee2e2;
      color: var(--red-dark);
      font-family: 'Fredoka', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .polaroid {
      background: #fff;
      padding: 10px 10px 16px;
      border-radius: 16px;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.14);
      border: 1px solid #e2e8f0;
      width: min(240px, 68vw);
      margin: 0 auto 16px;
      transform: rotate(-1.5deg);
    }

    .photo-frame {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      background: linear-gradient(135deg, #dbeafe, #fce7f3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    .target-caption {
      margin-top: 12px;
    }

    .target-caption .pre {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 700;
    }

    .target-name {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.75rem, 6vw, 2.2rem);
      color: var(--red-dark);
      line-height: 1.1;
      margin-top: 2px;
    }

    .tagline {
      background: #f1f5f9;
      border-left: 4px solid var(--pine);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 0.93rem;
      color: #334155;
      line-height: 1.4;
      margin-bottom: 18px;
      text-align: left;
    }

    .brief {
      background: #fffbeb;
      border: 2px dashed #f59e0b;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .brief-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.85rem;
      color: #92400e;
      margin-bottom: 10px;
    }

    .brief-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
    }

    .brief-item {
      background: #fff;
      border-radius: 12px;
      padding: 10px 8px;
      border: 1px solid #fde68a;
    }

    .brief-item dt {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #92400e;
      font-weight: 800;
      margin-bottom: 3px;
    }

    .brief-item dd {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      color: var(--ink);
    }

    .card-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .replay-btn {
      border: none;
      background: #e2e8f0;
      color: var(--ink);
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 9px 16px;
      border-radius: 999px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .replay-btn:hover { background: #cbd5e1; }
    .replay-btn:active { transform: scale(0.96); }

    .secret-note {
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* --- ERROR SCREEN --- */
    .error-card {
      background: var(--card);
      color: var(--ink);
      border-radius: var(--radius);
      padding: clamp(22px, 5vw, 32px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      border: 3px solid rgba(230, 57, 70, 0.65);
    }

    .error-emoji {
      font-size: 3.2rem;
      margin: 6px 0 10px;
    }

    .error-card h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.45rem, 5vw, 1.85rem);
      color: var(--red-dark);
      margin-bottom: 10px;
    }

    .error-card p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .error-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px;
      color: #334155;
      font-size: 0.9rem;
      line-height: 1.45;
      margin-bottom: 14px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="snow-canvas" class="fx-layer" aria-hidden="true"></canvas>
  <canvas id="confetti-canvas" class="fx-layer" aria-hidden="true"></canvas>

  <main>
    <!-- ÉCRAN MISSION -->
    <section id="mission-screen" class="screen hidden">
      <header>
        <div class="badge">🎄 Dossier Top Secret • Secret Santa Lictevout</div>
        <h1 class="hero-title">Salut <span id="giver-name" class="accent">...</span> !</h1>
        <p class="hero-sub">Le QG du Pôle Nord vient de parachuter ta mission officielle de Noël.</p>
      </header>

      <!-- ÉTAPE 1 : PAQUET CADEAU -->
      <div id="gift-stage" class="gift-stage">
        <div id="speech-bubble" class="speech-bubble">Tape sur le paquet pour découvrir ta cible !</div>

        <button id="gift-btn" class="gift-btn" type="button" aria-label="Ouvrir le paquet cadeau">
          <div class="gift-box">
            <div class="gift-bow">
              <span class="bow-loop left"></span>
